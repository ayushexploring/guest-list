<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9B273A">
<meta name="robots" content="noindex, nofollow">
<title>Guest List</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128140;</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<noscript>
  <p class="note">This guest list needs JavaScript. Please turn it on and reload.</p>
</noscript>

<div class="wrap">

  <header class="top">
    <span class="orn">&#9670;</span>
    <h1 class="script" id="title">Guest List</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <!-- ============ LOCK SCREEN ============ -->
  <section class="card" id="lockScreen" hidden>
    <form id="unlockForm" autocomplete="on">
      <h2>Welcome</h2>
      <p class="muted">Enter the family passcode to open the list.</p>

      <label for="passcode">Family passcode</label>
      <input id="passcode" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>

      <label for="myName">Your name</label>
      <input id="myName" type="text" autocomplete="given-name" placeholder="So everyone knows who added whom" required maxlength="40">

      <button class="btn primary" type="submit" id="unlockBtn">Open guest list</button>
      <p class="error" id="unlockError" role="alert" hidden></p>
    </form>
  </section>

  <section class="card" id="notConfigured" hidden>
    <h2>Almost ready</h2>
    <p class="muted">This app has not been connected to its storage yet.
      Open <a href="setup.html">setup.html</a> and follow the steps in the README.</p>
  </section>

  <!-- ============ THE APP ============ -->
  <main id="app" hidden>

    <section class="stats" id="stats" aria-label="Totals"></section>

    <section class="card" id="formCard">
      <h2 id="formTitle">Add a guest</h2>
      <form id="guestForm" novalidate>
        <label for="gName">Name</label>
        <input id="gName" type="text" required maxlength="80" autocomplete="off" placeholder="e.g. Sharma Uncle &amp; family">

        <label for="gCategory">Category</label>
        <select id="gCategory" required></select>
        <div class="inline-add" id="newCatRow" hidden>
          <input id="newCatName" type="text" maxlength="40" placeholder="New category name" autocomplete="off">
          <button class="btn small" type="button" id="newCatAdd">Add</button>
          <button class="btn small ghost" type="button" id="newCatCancel">Cancel</button>
        </div>

        <span class="label" id="sideLabel">Side</span>
        <div class="chips" id="gSide" role="group" aria-labelledby="sideLabel"></div>

        <label for="gCount">No. of people</label>
        <div class="stepper">
          <button class="btn small ghost" type="button" data-step="-1" aria-label="One fewer">&minus;</button>
          <input id="gCount" type="number" inputmode="numeric" min="1" max="99" value="1">
          <button class="btn small ghost" type="button" data-step="1" aria-label="One more">+</button>
        </div>

        <label for="gNotes">Notes <span class="muted">(optional)</span></label>
        <textarea id="gNotes" rows="2" maxlength="300" placeholder="Anything worth remembering"></textarea>

        <div class="form-actions">
          <button class="btn primary" type="submit" id="saveBtn">Add guest</button>
          <button class="btn ghost" type="button" id="cancelEdit" hidden>Cancel</button>
          <button class="btn danger" type="button" id="deleteBtn" hidden>Delete</button>
        </div>
      </form>
    </section>

    <section class="toolbar" aria-label="Search and filter">
      <input id="search" type="search" placeholder="Search names, notes, who added&hellip;" autocomplete="off">
      <div class="filters">
        <select id="filterCat" aria-label="Filter by category"></select>
        <select id="filterSide" aria-label="Filter by side"></select>
      </div>
      <p class="muted small" id="showing"></p>
    </section>

    <section id="list" aria-live="polite"></section>
    <p class="empty" id="emptyMsg" hidden></p>

    <footer class="actions">
      <button class="btn ghost" type="button" id="manageCats">Categories</button>
      <button class="btn ghost" type="button" id="exportCsv">Export CSV</button>
      <button class="btn ghost" type="button" id="refreshBtn">Refresh</button>
      <p class="muted small">
        You are <strong id="meName"></strong> &middot;
        <button class="link" type="button" id="changeName">change name</button> &middot;
        <button class="link" type="button" id="lockBtn">lock this device</button>
      </p>
    </footer>
  </main>

</div>

<!-- ============ CATEGORIES DIALOG ============ -->
<dialog id="catDialog" aria-labelledby="catTitle">
  <div class="dialog-body">
    <h2 id="catTitle">Categories</h2>
    <ul class="cat-list" id="catList"></ul>
    <form class="inline-add" id="catAddForm">
      <input id="catAddName" type="text" maxlength="40" placeholder="New category" autocomplete="off" required>
      <button class="btn small primary" type="submit">Add</button>
    </form>
    <button class="btn ghost close" type="button" id="catClose">Done</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="js/vault.js"></script>
<script src="js/app.js"></script>
</body>
</html>
